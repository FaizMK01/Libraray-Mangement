name: library_mangement
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  get: ^4.6.5
  get_storage: ^2.1.1

  # Firebase
  firebase_core: ^4.10.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0

  # Network / API
  http: ^1.2.2
  cached_network_image: ^3.4.1

  # In-app book reader
  syncfusion_flutter_pdfviewer: ^27.1.48   # direct PDF links
  webview_flutter: ^4.10.0                 # Google Books HTML pages

  # External links (mailto, share, etc.)
  url_launcher: ^6.3.1

  # UI helpers
  fluttertoast: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # assets:          ← commented out until you create the folders
  #   - assets/
  #   - assets/images/